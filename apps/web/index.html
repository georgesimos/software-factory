<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Factory</title>
  <link rel="icon" href="data:,">
  <script>
    // Apply ?theme= or the saved theme before first paint.
    try { const t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('sf.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- For a host to inline the run data, as page() in packages/server/src/server.ts does for dashboard.html.
       F ui serves this build at /app/, which reads GET /api/state instead and leaves the placeholder. -->
  <script type="application/json" id="data">__FACTORY_DATA__</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
