<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Factory · Design system</title>
  <script>
    // Apply ?theme= before first paint so screenshots never flash the other theme.
    try { const t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('sf.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
