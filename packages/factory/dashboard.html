<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<script>try { var t = localStorage.getItem('factory.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9; --surface: #ffffff; --sunken: #f4f4f2;
  --ink: #111110; --ink-2: #57574f; --ink-3: #707069;
  --line: #e8e8e4; --line-2: #d5d5cf;
  --accent: #3550dc;
  --ok: #2c7a51; --bad: #bf3d2b; --warn: #a06604; --idle: #9a9a93;
  --sans: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px; --hh: 57px; --gut: 32px;
  /* --pw is the reader's dragged width (px); the clamp keeps a width saved on a big screen sane on a small one. */
  --panel: clamp(420px, var(--pw, clamp(480px, 44vw, 760px)), calc(100vw - 340px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #121214; --sunken: #0f0f11;
    --ink: #ededeb; --ink-2: #a5a59f; --ink-3: #82827c;
    --line: #222225; --line-2: #333337;
    --accent: #8c9dff;
    --ok: #6cbf8f; --bad: #ec8b79; --warn: #d9ad5e; --idle: #67675f;
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0b0c; --surface: #121214; --sunken: #0f0f11;
    --ink: #ededeb; --ink-2: #a5a59f; --ink-3: #82827c;
    --line: #222225; --line-2: #333337;
    --accent: #8c9dff;
    --ok: #6cbf8f; --bad: #ec8b79; --warn: #d9ad5e; --idle: #67675f;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .label { font-family: var(--mono); }
.label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Header */
.top { position: sticky; top: 0; z-index: 30; height: var(--hh); display: flex; align-items: center; gap: 24px;
  padding: 0 var(--gut); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font: 600 14px/1 var(--sans); letter-spacing: -.01em; white-space: nowrap; }
.mark { width: 14px; height: 14px; flex: none;
  background: conic-gradient(var(--accent) 0 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0); }
.seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.seg .own { color: var(--ink-3); }
.theme { display: flex; flex: none; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 8px; }
.theme button { display: grid; place-items: center; width: 26px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: none;
  color: var(--ink-3); cursor: pointer; font: 13px/1 var(--sans); }
.theme button:hover { color: var(--ink); }
.theme button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.ptog { display: grid; place-items: center; flex: none; width: 32px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
  background: none; color: var(--ink-3); cursor: pointer; }
.ptog[hidden] { display: none; }
.ptog:hover { color: var(--ink); border-color: var(--line-2); }
.ptog .pi { width: 15px; height: 12px; border: 1.5px solid currentColor; border-radius: 2.5px; }
.ptog[aria-expanded="true"] { color: var(--ink); }
.ptog[aria-expanded="true"] .pi { box-shadow: inset -5px 0 0 currentColor; }
.updated { margin-left: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; font: 12px var(--mono); color: var(--ink-3); }

/* Overview */
.shell { padding: 36px var(--gut) 64px; }
.metrics { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 1px; background: var(--line);
  border-block: 1px solid var(--line); }
.metric { background: var(--bg); padding: 18px 24px 22px 0; min-width: 0; }
.metric + .metric { padding-left: 24px; }
.metric .v { margin-top: 16px; font: 400 clamp(30px, 3.4vw, 44px)/1 var(--sans); letter-spacing: -.035em;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric .v small { font-size: .46em; letter-spacing: 0; color: var(--ink-3); margin-left: 3px; }
.metric .v small.pre { margin: 0 2px 0 0; }
.metric .v.none { color: var(--ink-3); }
.metric .s { margin-top: 10px; font: 12px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.board-wrap { margin-top: 40px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; }
.board { display: grid; grid-template-columns: repeat(7, minmax(184px, 1fr)); min-width: min-content; }
.board.shut { grid-template-columns: repeat(6, minmax(184px, 1fr)) 52px; }
.col { min-width: 0; padding: 0 12px 8px; border-left: 1px solid var(--line); scroll-snap-align: start; }
.col:first-child { border-left: 0; padding-left: 0; }
.col:last-child { padding-right: 0; }
.col-h { display: flex; align-items: center; gap: 8px; height: 40px; }
.col-h h2 { margin: 0; }
.col-h .n { color: var(--ink-3); font: 11px var(--mono); font-variant-numeric: tabular-nums; }
.col-h .idx { color: var(--line-2); font: 11px var(--mono); }
.col-h .count { margin-left: auto; font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.done .c-title { -webkit-line-clamp: 1; }
.done .c-foot { margin-top: 8px; }
.col .empty-col { height: 64px; border: 1px dashed var(--line); border-radius: var(--r); }
.more { padding: 10px 2px; font: 11px var(--mono); color: var(--ink-3); }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; height: 40px; }
.toggle .chev { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
.toggle[aria-expanded="false"] .chev { transform: rotate(-45deg); }
.board.shut .col.done { padding-right: 0; }
.board.shut .col.done .col-h { flex-direction: column; height: auto; padding-top: 12px; gap: 10px; }
.board.shut .col.done .toggle { flex-direction: column; height: auto; }
.board.shut .col.done .toggle .label { writing-mode: vertical-rl; }

.card { display: block; position: relative; padding: 11px 12px 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); text-decoration: none; transition: border-color .12s; }
.card:hover { border-color: var(--line-2); }
.card[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 .5px var(--ink); }
.card.tracked { background: transparent; }
.card.tracked .c-title { color: var(--ink-2); font-weight: 400; }
.c-top { display: flex; align-items: center; gap: 7px; font: 11px/1 var(--mono); color: var(--ink-3); }
.c-id { display: flex; min-width: 0; white-space: nowrap; }
.c-repo { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.c-num { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.c-top time { margin-left: auto; flex: none; }
.c-title { margin: 7px 0 0; font: 500 13.5px/1.38 var(--sans); letter-spacing: -.005em; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
.c-foot:empty { display: none; }

.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--idle); }
.dot.run { background: var(--accent); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.dot.live { animation: live 2s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); } }
.chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 6px; border: 1px solid var(--line);
  border-radius: 4px; font: 500 10.5px/1.1 var(--mono); letter-spacing: .03em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 32%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
.chip.run { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
.chip.quiet { color: var(--ink-3); border-style: dashed; }
.chip.rn { margin-top: 5px; padding: 2px 5px; font-size: 9.5px; color: var(--ink-3); }
td.v .chip.rn { margin: 0 0 0 6px; vertical-align: middle; }
.rules { display: flex; gap: 6px; min-width: 0; overflow: hidden; flex: 0 1000 auto; } /* shrinks before the project switcher */
.rules .chip { flex: none; white-space: nowrap; cursor: default; }
.rlog { margin-top: 40px; }
.rlog ul { list-style: none; margin: 10px 0 0; padding: 0; font: 12px/1.5 var(--mono); color: var(--ink-2); }
.rlog li { padding: 3px 0; overflow-wrap: anywhere; }
.rlog time { color: var(--ink-3); margin-right: 8px; }
.iters { display: inline-flex; gap: 3px; align-items: center; }
.iters i { width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line-2); }
.iters i.on { background: var(--ink-2); box-shadow: none; }
.iters.capped i.on { background: var(--warn); }
.axes { display: inline-flex; align-items: center; gap: 6px; font: 10.5px var(--mono); color: var(--ink-3); }
.axes span { display: inline-flex; gap: 2px; }
.axes i { width: 8px; height: 3px; border-radius: 1px; background: var(--line-2); }
.axes i.ok { background: var(--ok); } .axes i.bad { background: var(--bad); }
.loops { font: 10.5px var(--mono); color: var(--warn); }

.empty { margin-top: 40px; padding: 72px 24px; text-align: center; border: 1px dashed var(--line-2); border-radius: 10px; }
.empty .mark { margin: 0 auto 20px; width: 18px; height: 18px; }
.empty h2 { margin: 0; font: 500 18px var(--sans); letter-spacing: -.01em; }
.empty p { margin: 8px 0 0; color: var(--ink-2); }
.empty code { white-space: nowrap; font: 12.5px var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }

/* Run detail: a docked column beside the board on wide screens, a full view on narrow ones. */
.detail { position: fixed; z-index: 20; top: var(--hh); right: 0; bottom: 0; width: var(--panel); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-left: 1px solid var(--line); font-size: 14.5px; container-type: inline-size;
  --px: max(40px, calc(50cqi - 440px)); /* side padding that caps the reading column at 880px, even in focus mode */ }
.detail.enter .d-in { animation: enter .2s cubic-bezier(.2, .7, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateX(8px); } }
.resizer { position: fixed; z-index: 25; top: var(--hh); bottom: 0; right: calc(var(--panel) - 5px); width: 10px; cursor: col-resize; touch-action: none; }
.resizer::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: transparent; transition: background .12s; }
.resizer:hover::before, .resizer:focus-visible::before, body.dragging .resizer::before { background: var(--accent); }
.resizer:focus-visible { outline: none; }
body.dragging { cursor: col-resize; user-select: none; }
.d-in { padding: 0 var(--px) 80px; }
.d-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; min-height: 56px; margin: 0 calc(-1 * var(--px));
  padding: 10px var(--px); background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.d-bar .id { font: 12px var(--mono); color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-bar .chip { flex: 0 1 auto; min-width: 0; }
.d-bar-t { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/1.3 var(--sans); letter-spacing: -.01em; }
.detail.scrolled .d-bar-t { display: block; } /* once the big title scrolls away, the bar carries it */
.detail.scrolled .d-bar .id, .detail.scrolled .d-bar .chip { display: none; }
.d-acts { margin-left: auto; display: flex; gap: 6px; flex: none; }
.act { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line);
  border-radius: 6px; background: none; cursor: pointer; font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.act:hover { color: var(--ink); border-color: var(--line-2); }
.act[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); background: var(--sunken); }
.act.close { padding-right: 6px; }
.act kbd { font: 10.5px var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--sunken); color: var(--ink-3); }
.d-title { margin: 28px 0 0; font: 500 30px/1.2 var(--sans); letter-spacing: -.025em; overflow-wrap: anywhere; }
.d-title:focus { outline: none; }
.d-spec { margin: 12px 0 0; color: var(--ink-2); font-size: 16px; line-height: 1.55; max-width: 68ch; }
.d-empty { padding: 18vh 0 0; text-align: center; }
.d-empty .mark { margin: 0 auto 22px; width: 18px; height: 18px; opacity: .8; }
.d-empty h2 { margin: 0; font: 500 20px var(--sans); letter-spacing: -.015em; }
.d-empty p { margin: 10px auto 0; max-width: 36ch; color: var(--ink-2); }
.d-empty kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--sunken); color: var(--ink-2); }
.d-meta { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--mono); color: var(--ink-3); }
.d-meta span { overflow-wrap: anywhere; }
.links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; text-decoration: none; color: var(--ink); }
.links a:hover { border-color: var(--ink-3); }
.links a::after { content: "↗"; color: var(--ink-3); font-size: 12px; }
.sec { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
.sec > h3 { margin: 0 0 20px; }
.sec > h3.label { font: 600 16px/1.3 var(--sans); letter-spacing: -.01em; text-transform: none; color: var(--ink); }
.muted { color: var(--ink-3); font-size: 13px; margin: 0; }

.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.st { position: relative; text-align: center; padding: 0 2px; }
.st:not(:first-child)::before { content: ""; position: absolute; top: 6px; left: -50%; right: 50%; height: 1px; background: var(--line-2); }
.st.done + .st::before { background: var(--ink-3); }
.st .n { position: relative; z-index: 1; display: block; width: 13px; height: 13px; margin: 0 auto; border-radius: 50%;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.st.done .n { background: var(--ok); box-shadow: none; }
.st.bad .n { background: var(--bad); box-shadow: none; }
.st.warn .n { background: var(--warn); box-shadow: none; }
.st.idle .n { background: var(--idle); box-shadow: none; }
.st.active .n { box-shadow: inset 0 0 0 2px var(--accent); }
.st.active .n::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); }
.st.skip .n { box-shadow: none; border: 1px dashed var(--line-2); }
.st.cur .n { outline: 4px solid color-mix(in srgb, var(--accent) 14%, transparent); }
.st.cur.done .n, .st.cur.idle .n { outline-color: color-mix(in srgb, var(--ok) 14%, transparent); }
.st.cur.bad .n { outline-color: color-mix(in srgb, var(--bad) 14%, transparent); }
.st.cur.warn .n { outline-color: color-mix(in srgb, var(--warn) 16%, transparent); }
.st.stale { opacity: .45; }
.st .nm { margin-top: 10px; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.st.cur .nm { color: var(--ink); }
.st .sb { margin-top: 2px; font: 11px/1.3 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.arcs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 6px; }
.arc { grid-row: 1; position: relative; height: var(--h); margin-inline: calc(50% / var(--span)); margin-bottom: 22px;
  border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); border-top: 0; border-radius: 0 0 9px 9px; }
.arc::before { content: ""; position: absolute; left: -4.5px; top: -5px; border: 4px solid transparent; border-top: 0; border-bottom: 6px solid var(--warn); }
.arc span { position: absolute; top: calc(100% + 4px); left: 0; white-space: nowrap; font: 11px var(--mono); color: var(--warn); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
th { font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
td:first-child { font: 12.5px var(--mono); color: var(--ink-2); }
td.v { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
td.v.passed { color: var(--ok); } td.v.failed { color: var(--bad); } td.v.wait { color: var(--accent); } td.v.na { color: var(--line-2); }
.finds { margin: 18px 0 0; padding: 0; list-style: none; }
.find { position: relative; display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; padding: 10px 0; border-top: 1px dashed var(--line); }
.find:first-child { border-top: 0; }
.find .sev { width: 7px; height: 7px; margin-top: 7px; border-radius: 1.5px; background: var(--idle); }
.find .sev.high { background: var(--bad); } .find .sev.medium { background: var(--warn); }
.find .is { font-size: 13.5px; overflow-wrap: anywhere; }
.find .fm { grid-column: 2; font: 11.5px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.find.dis .is { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-3); }
.find.dis { cursor: help; }
.find.dis:focus-visible { outline-offset: 0; border-radius: 4px; }
.tip { position: absolute; z-index: 2; left: 20px; top: calc(100% - 4px); max-width: min(420px, calc(100% - 20px)); padding: 8px 10px;
  border-radius: 6px; background: var(--ink); color: var(--bg); font: 12px/1.45 var(--sans); box-shadow: 0 8px 24px -8px rgb(0 0 0 / .3);
  opacity: 0; visibility: hidden; transform: translateY(-2px); transition: opacity .12s, transform .12s, visibility .12s; pointer-events: none; }
.find.dis:hover .tip, .find.dis:focus-visible .tip { opacity: 1; visibility: visible; transform: none; }

.verdict { display: flex; align-items: center; gap: 10px; font: 500 19px/1.3 var(--sans); letter-spacing: -.015em; }
.verdict .dot { width: 8px; height: 8px; }
.reasons { margin: 12px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 13.5px; }
.reasons li { position: relative; padding: 3px 0 3px 16px; overflow-wrap: anywhere; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 7px; height: 1px; background: var(--ink-3); }
.callout { margin-top: 14px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); border-radius: 8px; font-size: 13.5px; }
.callout b { color: var(--bad); font-weight: 500; }
.callout a { margin-left: 6px; color: var(--ink); }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0 20px; }
.fact { padding: 12px 0 14px; border-top: 1px solid var(--line); }
.fact .v { margin-top: 8px; font: 400 22px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fact .s { margin-top: 6px; font: 11px var(--mono); color: var(--ink-3); }

<script>

  x = obj(x);
  const fb = obj(x.fallback), from = obj(fb.from), last = (n) => String(n).split(':').pop();
  const name = (y) => y.use === 'skill' ? 'skill: ' + y.name : y.use === 'brief' ? 'brief: ' + String(y.path || '').split('/').pop() : y.use === 'provider' ? [y.harness, y.name].filter(Boolean).join(': ') : null;

};
const dur = (x) => !num(x) || x < 0 ? null : x < 3600e3 ? [String(Math.max(1, Math.round(x / 60e3))), 'm'] : x < 864e5 ? [(x / 3600e3).toFixed(1), 'h'] : [(x / 864e5).toFixed(1), 'd'];

const money = (x) => (num(x) ? '$' + (x >= 1000 ? Math.round(x).toLocaleString() : x.toFixed(2)) : null);

  const live = SK.token
    ? el('p', { class: 'sk-live' }, dot('ok'), 'Live: changes save to ~/.claude/factory/skills.json')
    : el('p', { class: 'sk-live' }, dot('idle'), el('span', {}, 'Read-only page. Run ', el('code', {}, 'F ui'), ' to edit here; until then, each change gives you the command to run.'));
  if (S.error) {
    d.replaceChildren(head, el('div', { class: 'sk-body' }, live, el('p', { class: 'sk-err' }, 'skills.json is invalid: ' + S.error + '. Fix the file, then reload.')));
    return;
  }

  const seg = el('nav', { class: 'seg', 'aria-label': 'Scope' }, ['default', ...scopes].map((s) => {
    const b = el('button', { 'aria-pressed': String(s === scope), 'data-k': 'sk-scope:' + s }, s === 'default' ? 'Global' : s);
    b.onclick = () => { SK.scope = s; fillSkills(d); restoreFocus('sk-scope:' + s); };
    return b;
  }));
  const scopeNote = el('p', { class: 'muted' }, scope === 'default' ? 'Applies to every project unless the project picks its own.' : `Overrides the global choice for ${scope}, step by step.`);

  const act = async (step, runner, k) => {
    try { const m = await skApply(scope, step, runner, status); if (m) fillSkills(d, m); restoreFocus(k); }
    catch (e) { status.className = 'sk-status bad'; status.textContent = e.message; }
  };
  const row = (step) => {
    const here = step in mine, inherited = scope !== 'default' && !here && step in glob;
    const r = plan[step] || { use: 'default' };
    const isDef = !obj(r).use || r.use === 'default';
    const label = stepLabel(step), axis = step.startsWith('review.') ? step.slice(7) : null;
    const change = el('button', { class: 'copy', 'data-k': 'sk-change:' + step, 'aria-label': 'Change runner for ' + label }, 'Change');
    change.onclick = async () => {
      const picked = await pickRunner({ title: label, step, scope, current: r });
      if (picked) await act(step, picked.runner, 'sk-change:' + step);
    };
    const reset = here ? el('button', { class: 'copy', 'data-k': 'sk-reset:' + step, 'aria-label': (scope === 'default' ? 'Reset ' : 'Use the global runner for ') + label }, scope === 'default' ? 'Reset' : 'Use global') : null;
    if (reset) reset.onclick = () => act(step, null, 'sk-change:' + step);
    return el('tr', { class: 'sk-row' },
      el('th', { scope: 'row' }, label, axis && arr(S.required).includes(axis) ? chip('required', 'quiet sk-req') : null),
      el('td', { class: 'sk-runcell' }, el('div', { class: 'sk-run' },
        el('span', { class: 'sk-name' + (isDef ? ' def' : '') }, runnerName(r, scope)),
        isDef ? null : chip(kindOf(r, scope)),
        el('span', { class: 'sk-from' + (here ? ' here' : '') }, here ? (scope === 'default' ? 'set globally' : 'set for this project') : inherited ? 'from global' : 'built-in'))),
      el('td', { class: 'sk-act' }, change, reset));
  };
  const steps = arr(S.steps);
  const groups = [['Pipeline', steps.filter((k) => ['intake', 'spec', 'build'].includes(k))], ['Review axes', steps.filter((k) => k.startsWith('review.'))], ['After review', steps.filter((k) => ['verifier', 'postmerge'].includes(k))]];
  const table = el('table', { class: 'sk-table' }, el('caption', { class: 'sr' }, 'Runner per step for ' + (scope === 'default' ? 'all projects' : scope)),
    groups.map(([g, ks]) => el('tbody', {}, el('tr', { class: 'sk-group' }, el('th', { colspan: '3', scope: 'colgroup' }, g)), ks.map(row))));

  // Extra axes: a scope's list is saved whole. Under a project, global axes show read-only.
  const own = arr(mine['axes.extra']).map(obj), fromGlobal = scope === 'default' ? [] : arr(glob['axes.extra']).map(obj).filter((x) => !own.some((y) => y.axis === x.axis));
  const saveAxes = (list, k) => act('axes.extra', list.length ? list : null, k);
  const axisItem = (x, editable) => {
    const items = [chip(x.axis), el('span', { class: 'sk-glob' }, arr(x.when).join(', ')), el('span', { class: 'sk-name' }, runnerName(x, scope)), editable ? null : el('span', { class: 'sk-from' }, 'from global')];
    if (editable) {
      const edit = el('button', { class: 'copy', 'data-k': 'sk-axis:' + x.axis, 'aria-label': 'Edit the ' + x.axis + ' axis' }, 'Edit');
      edit.onclick = async () => {
        const { axis: _a, when: _w, ...runner } = x;
        const p = await pickRunner({ title: 'Review · ' + x.axis, step: 'axes.extra', scope, current: runner, axis: x });
        if (p) await saveAxes(own.map((y) => (y.axis === x.axis ? { axis: p.axis, when: p.when, ...p.runner } : y)), 'sk-axis:' + p.axis);
      };
      const rm = el('button', { class: 'copy', 'aria-label': 'Remove the ' + x.axis + ' axis' }, 'Remove');
      rm.onclick = () => saveAxes(own.filter((y) => y.axis !== x.axis), 'sk-add-axis');
      items.push(el('span', { class: 'sk-act' }, edit, rm));
    }
    return el('li', {}, items);
  };
  const add = el('button', { class: 'sk-ghost', 'data-k': 'sk-add-axis' }, '+ Add axis');
  add.onclick = async () => {
    const p = await pickRunner({ title: 'New review axis', step: 'axes.extra', scope, current: null, axis: { axis: '', when: [] } });
    if (p) await saveAxes([...own.filter((y) => y.axis !== p.axis), { axis: p.axis, when: p.when, ...p.runner }], 'sk-axis:' + p.axis);
  };
  const axes = el('section', { class: 'sk-axes', 'aria-labelledby': 'sk-axes-t' },
    el('h3', { id: 'sk-axes-t' }, 'Extra review axes'),
    el('p', { class: 'muted' }, 'Reviewed next to the built-in axes whenever a changed file matches. They add to code and security, never replace them.'),
    own.length || fromGlobal.length ? el('ul', {}, [...fromGlobal.map((x) => axisItem(x, false)), ...own.map((x) => axisItem(x, true))]) : null, add);

  d.replaceChildren(head, el('div', { class: 'sk-body' }, live, el('div', { class: 'sk-scope' }, seg), scopeNote, table, axes, status));
}

// Resolves to {runner, axis?, when?} or null. Every catalog entry is offered for every step.
function pickRunner({ title, step, scope, current, axis }) {
  return new Promise((resolve) => {
    const entries = skEntries(scope);
    const globalNames = new Set(entries.filter((e) => e.source === 'global').map((e) => obj(e.runner).name));
    const isReview = step.startsWith('review.') || step === 'axes.extra' || step === 'verifier';
    const d = el('dialog', { class: 'sk sk-pick', 'aria-labelledby': 'pk-title' });
    let filter = 'all', result = null;
    const q = el('input', { class: 'sk-input', type: 'search', placeholder: `Search ${entries.length} skills, agents and tools`, 'aria-label': 'Search runners', 'aria-controls': 'pk-list' });
    const list = el('div', { class: 'sk-list', id: 'pk-list' });
    const msg = el('p', { class: 'sk-status', role: 'status', 'aria-live': 'polite' });
    const skillName = el('input', { class: 'sk-input mono', placeholder: 'skill or plugin:skill', 'aria-label': 'Skill name' });
    const briefPath = el('input', { class: 'sk-input mono', placeholder: '~/.claude/factory/briefs/my-review.md', 'aria-label': 'Brief file path' });
    const axisName = axis ? el('input', { class: 'sk-input mono', value: axis.axis || '', placeholder: 'a11y', 'aria-label': 'Axis name', pattern: '[a-z][a-z0-9-]*' }) : null;
    const globs = axis ? el('input', { class: 'sk-input mono', value: arr(axis.when).join(', '), placeholder: '**/*.tsx, **/*.jsx', 'aria-label': 'Files that select this axis' }) : null;
    const cur = current ? runnerKey(current) : null;
    if (current && !findEntry(current, scope)) { if (obj(current).use === 'skill') skillName.value = current.name || ''; if (obj(current).use === 'brief') briefPath.value = current.path || ''; }

    const filters = el('nav', { class: 'seg', 'aria-label': 'Source' });
    const counts = Object.fromEntries(SK_SOURCES.map(([k]) => [k, k === 'all' ? entries.length : entries.filter((e) => e.source === k).length]));
    const drawFilters = () => filters.replaceChildren(...SK_SOURCES.filter(([k]) => counts[k] || k === 'all').map(([k, label]) => {
      const b = el('button', { type: 'button', 'aria-pressed': String(k === filter) }, label, el('span', { class: 'own' }, ' ' + counts[k]));
      b.onclick = () => { filter = k; drawFilters(); draw(); };
      return b;
    }));
    const opt = (value, checked, title, extra) => el('label', { class: 'sk-opt' }, el('input', { type: 'radio', name: 'pk', value, checked: checked ? '' : null }), title, ...extra);
    const draw = () => {
      const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
      const shown = entries.map((e, i) => [e, i]).filter(([e]) => (filter === 'all' || e.source === filter) &&
        words.every((w) => [e.name, e.desc, e.group, e.kind].join(' ').toLowerCase().includes(w)));
      const byGroup = new Map();
      for (const [e, i] of shown) { const g = (e.source === 'project' ? 'Project · ' : '') + e.group; if (!byGroup.has(g)) byGroup.set(g, []); byGroup.get(g).push([e, i]); }
      const groups = [...byGroup].map(([g, items]) => el('div', { role: 'group', 'aria-label': g }, el('h4', {}, g), items.map(([e, i]) => opt(String(i), runnerKey(e.runner) === cur,
        el('span', { class: 't' }, el('span', { class: 'sk-name' }, e.name), chip(e.kind)),
        [e.desc ? el('span', { class: 'd' }, e.desc) : null,
          e.source === 'project' && isReview ? el('span', { class: 'w' }, 'Comes from the repo: a PR that edits it touches .claude/, so it can never auto-merge.') : null,
          e.source === 'project' && globalNames.has(obj(e.runner).name) ? el('span', { class: 'w' }, 'A global skill has the same name; the config stores only the name.') : null]))));
      const custom = el('div', { role: 'group', 'aria-label': 'Not listed' }, el('h4', {}, 'Not listed'),
        opt('custom-skill', !!skillName.value, el('span', { class: 't' }, el('span', { class: 'sk-name' }, 'A skill by name'), chip('skill')), [el('span', { class: 'd' }, 'Any skill Claude Code can invoke, including ones this page can’t see.'), skillName]),
        opt('custom-brief', !!briefPath.value, el('span', { class: 't' }, el('span', { class: 'sk-name' }, 'A markdown brief'), chip('brief')), [el('span', { class: 'd' }, 'An absolute or ~/ path to a .md file, outside any repo.'), briefPath]));
      list.replaceChildren(el('fieldset', {}, el('legend', { class: 'sr' }, 'Runner for ' + title), groups.length ? groups : el('p', { class: 'sk-empty' }, 'Nothing matches. Try another word, or name a skill below.'), custom));
    };
    for (const inp of [skillName, briefPath]) inp.addEventListener('input', () => { const r = list.querySelector(`input[value="${inp === skillName ? 'custom-skill' : 'custom-brief'}"]`); if (r) r.checked = true; });
    q.addEventListener('input', draw);

    const done = el('button', { class: 'sk-primary', type: 'button' }, SK.token ? 'Save' : 'Copy command');
    const cancel = el('button', { class: 'sk-ghost', type: 'button' }, 'Cancel');
    cancel.onclick = () => d.close();
    done.onclick = () => {
      const v = list.querySelector('input[name="pk"]:checked')?.value;
      let runner = null;
      if (v === 'custom-skill') runner = skillName.value.trim() ? { use: 'skill', name: skillName.value.trim() } : null;
      else if (v === 'custom-brief') runner = briefPath.value.trim() ? { use: 'brief', path: briefPath.value.trim() } : null;
      else if (v != null) runner = entries[Number(v)].runner;
      const fail = (t) => { msg.className = 'sk-status bad'; msg.textContent = t; };
      if (!runner) return fail('Pick a runner, or fill in the name or path you chose.');
      if (axis) {
        const name = axisName.value.trim(), when = globs.value.split(',').map((g) => g.trim()).filter(Boolean);
        if (!/^[a-z][a-z0-9-]{0,30}$/.test(name)) return fail('Axis name: lowercase letters, digits and dashes, starting with a letter.');
        if (!when.length) return fail('Add at least one file pattern, such as **/*.tsx.');
        if (runner.use === 'default') return fail('An extra axis has no built-in brief: pick a skill, agent, tool or brief.');
        result = { runner, axis: name, when };
      } else result = { runner };
      d.close();
    };
    d.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.stopPropagation(); });
    d.addEventListener('close', () => { d.remove(); resolve(result); });

    const head = el('div', { class: 'sk-head' }, el('div', {}, el('h3', { id: 'pk-title' }, 'Runner for ' + title),
      el('p', { class: 'muted' }, scope === 'default' ? 'Global choice' : 'For ' + scope)));
    const fields = axis ? el('div', { class: 'sk-fields' }, el('label', { class: 'sk-field' }, 'Axis name', axisName), el('label', { class: 'sk-field' }, 'Review it when a changed file matches', globs)) : null;
    const tools = el('div', { class: 'sk-tools' }, q, filters,
      isReview ? el('p', { class: 'sk-note' }, 'A reviewer must reply with the review JSON. Prose tools go through the adapter brief; any other reply fails the axis.') : null);
    d.append(head, ...(fields ? [fields] : []), tools, list, el('div', { class: 'sk-foot' }, msg, cancel, done));
    drawFilters(); draw();
    document.body.append(d);
    d.showModal();
    (axisName && !axisName.value ? axisName : q).focus();
  });
}

skillsButton();

// file:// can't fetch, so the factory rewrites this file on every event and the page reloads to pick it up.
// Keep scroll and keyboard focus across that reload so it is invisible to the reader.
history.scrollRestoration = 'manual';
renderTheme();
render();
try {
  const s = JSON.parse(session('factory.view') || 'null');
  if (s) {
    const wrap = document.getElementById('board-wrap');
    if (wrap) wrap.scrollLeft = s.x || 0;
    document.getElementById('detail').scrollTop = s.d || 0;
    window.scrollTo(0, s.y || 0);
    const n = s.k && [...document.querySelectorAll('[data-k]')].find((x) => x.dataset.k === s.k);
    if (n) n.focus({ preventScroll: true });
  }
} catch {}
window.addEventListener('pagehide', () => {
  const wrap = document.getElementById('board-wrap');
  session('factory.view', JSON.stringify({ x: wrap ? wrap.scrollLeft : 0, y: window.scrollY, d: document.getElementById('detail').scrollTop,
    k: document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null }));
});
const tick = () => (document.querySelector('dialog[open]') ? setTimeout(tick, 10000) : location.reload()); // never reload under an open dialog
setTimeout(tick, 10000);
</script>
</body>
</html>
